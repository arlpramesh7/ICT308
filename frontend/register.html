<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create an account | SmartDine</title><link rel="stylesheet" href="/css/styles.css"><script src="/assets/lucide.js" defer></script></head>
<body><a class="skip" href="#main">Skip to content</a><header id="site-header"></header><main id="main" class="auth-layout wrap"><div class="auth-heading"><p class="eyebrow">Join the table</p><h1>Create your account</h1><p class="muted">Discover dining that fits your day.</p></div><form id="auth-form" class="auth-form"><div id="form-message" class="message" role="alert" hidden></div><label for="username">Name</label><input id="username" name="username" autocomplete="name" minlength="3" maxlength="50" required><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254"><label for="password">Password</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required aria-describedby="password-help"><button class="icon-button" type="button" id="show-password" title="Show password" aria-label="Show password"><i data-lucide="eye"></i></button></div><small id="password-help">At least 10 characters. Maximum 72 bytes.</small><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" required><label class="check"><input id="privacy-accepted" type="checkbox" required><span>I have read the <a href="/privacy.html" target="_blank" rel="noopener">privacy notice</a>.</span></label><button class="button wide" type="submit">Create account <i data-lucide="arrow-right"></i></button><p>Already registered? <a href="/login.html">Log in</a></p></form></main><footer><span>SmartDine</span><span>Good food, close to you.</span><a href="/privacy.html">Privacy</a></footer><div id="toast" role="status" aria-live="polite"></div><script type="module" src="/js/auth.js"></script></body></html>
